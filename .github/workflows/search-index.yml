name: Rebuild search index

# Keeps search-index.json in sync with page content. Without this the index
# silently goes stale whenever a page is edited directly on GitHub.
# Only fires when HTML changes, and only commits the JSON, so it cannot loop.

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'build-search-index.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reindex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild index
        run: python3 build-search-index.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- search-index.json; then
            echo "Index already current."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search-index.json
          git commit -m "Rebuild search index [skip ci]"
          git push
