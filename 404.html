<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Andrew Likoudis</title>
<script>
  // SPA redirect for GitHub Pages: encode the path into a query and bounce to index.
  var l = window.location;
  l.replace(
    l.protocol + '//' + l.host + '/?/' +
    l.pathname.slice(1).split('/').join('/').replace(/&/g, '~and~') +
    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
    l.hash
  );
</script>
</head>
<body></body>
</html>
